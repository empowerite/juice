# Codecov coverage upload — deployed by the empowerite github-repository Terraform module (enable_codecov).
#
# Do not edit in-repo: this file is managed by terraform (github_repository_file). Edit the source at
# empowerite/infrastructure/terraform/modules/github-repository/files/coverage.yml and re-apply.
#
# The job is guarded by `if: hashFiles('**/*.go') != ''` so it no-ops cleanly — no failing Actions — until the
# repo has Go code. Uploads authenticate with GitHub Actions OIDC (`use_oidc: true` + `id-token: write`), so there is
# no CODECOV_TOKEN secret to copy from the dashboard or rotate (#485).
name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # id-token: write lets the Codecov action request the run's OIDC token; scoped to this job, not the workflow.
    permissions:
      contents: read
      id-token: write
    # No-op until the repo has Go code — keeps Actions green and avoids a failing required check.
    if: hashFiles('**/*.go') != ''
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.txt ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage.txt
          fail_ci_if_error: true
