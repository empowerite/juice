# Codecov coverage upload — deployed by the empowerite github-repository Terraform module (enable_codecov).
#
# Do not edit in-repo: this file is managed by terraform (github_repository_file). Edit the source at
# empowerite/infrastructure/terraform/modules/github-repository/files/coverage.yml and re-apply.
#
# Every step after the checkout is guarded by `if: hashFiles('**/*.go') != ''`, so the job ends green with nothing
# to do until the repo has Go code. Uploads authenticate with GitHub Actions OIDC (`use_oidc: true` +
# `id-token: write`), so there is no CODECOV_TOKEN secret to copy from the dashboard or rotate (#485).
name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # id-token: write lets the Codecov action request the run's OIDC token; scoped to this job, not the workflow.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Every step below is skipped until the repo has Go code, so the job ends green with nothing to do. The guard
      # is on the steps, after the checkout: hashFiles reads the checked-out tree, and GitHub allows it in a step's
      # `if` alone. In a job's `if` it is a workflow file error, and no job starts.
      - name: Set up Go
        if: hashFiles('**/*.go') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        if: hashFiles('**/*.go') != ''
        run: go test -coverprofile=coverage.txt ./...

      - name: Upload coverage to Codecov
        if: hashFiles('**/*.go') != ''
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage.txt
          fail_ci_if_error: true
